server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users, /users/**
        - id: station-service
          uri: lb://STATION-SERVICE
          predicates:
            - Path=/stations, /stations/**
        - id: session-service
          uri: lb://SESSION-SERVICE
          predicates:
            - Path=/sessions, /sessions/**
        - id: billing-service
          uri: lb://BILLING-SERVICE
          predicates:
            - Path=/billing, /billing/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: voltgrid-super-secret-key-32-characters-minimum-secure-key-2026
  expiration-ms: 86400000
