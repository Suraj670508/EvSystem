server:
  port: 8084

spring:
  application:
    name: SESSION-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5432/voltgrid_session_db
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
